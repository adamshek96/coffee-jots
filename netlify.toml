[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: everything renders from the one entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached, or updates never land.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify serves .webmanifest as application/octet-stream by default, which
# Chrome rejects — the manifest must declare its real type to be installable.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
